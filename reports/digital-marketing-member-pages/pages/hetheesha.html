<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hetheesha — Blog Tool</title>
<style>html{visibility:hidden;}</style>
<script>
// Auth guard — this page is locked to the "hetheesha" account only (or admin).
(function () {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/auth?action=session', false);
    xhr.withCredentials = true;
    xhr.send(null);
    if (xhr.status === 200) {
      var data = JSON.parse(xhr.responseText);
      if (data && data.success && data.user) {
        if (data.user.staff_key === 'hetheesha' || data.user.role === 'admin') {
          document.documentElement.style.visibility = 'visible';
          return;
        }
        var landing = { muguntha:'muguntha.html', jefri:'jefri.html', dilaksi:'dilaksi.html', kamsi:'kamsi.html', mahima:'mahima.html', thasitha:'thasitha.html', sukirtha:'sukirtha.html', hetheesha:'hetheesha.html' };
        window.location.replace(landing[data.user.staff_key] || '../login.html');
        return;
      }
    }
  } catch (e) { /* fall through to login */ }
  window.location.replace('../login.html');
})();
</script>
<style>
:root{--sb-navy:#0c1a30;--sb-navy2:#0e2143;--sb-gold:#c9a227;--sb-text:#aab4c8;--sb-w:270px;--sb-w-collapsed:72px;--accent:#1f5eff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{margin:0;padding:0;}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden;background:#eef1f6;}
.ms-sidebar{width:var(--sb-w-collapsed);background:var(--sb-navy);color:var(--sb-text);display:flex;flex-direction:column;padding:16px 10px;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;transition:width .18s ease,padding .18s ease;z-index:40;}
.ms-sidebar .ms-brand-txt,.ms-sidebar .ms-navlabel,.ms-sidebar .ms-navlist a span.lbl,.ms-sidebar .ms-devbadge-txt,.ms-sidebar .ms-signout span.lbl{display:none;}
.ms-sidebar .ms-signout{justify-content:center;}
.ms-sidebar .ms-navlist a{justify-content:center;}
.ms-sidebar .ms-brand{justify-content:center;}
.ms-sidebar .ms-devbadge{justify-content:center;}
body.sb-open .ms-sidebar{width:var(--sb-w);padding:16px 14px;}
body.sb-open .ms-sidebar .ms-brand-txt,body.sb-open .ms-sidebar .ms-navlabel,body.sb-open .ms-sidebar .ms-navlist a span.lbl,body.sb-open .ms-sidebar .ms-devbadge-txt,body.sb-open .ms-sidebar .ms-signout span.lbl{display:block;}
body.sb-open .ms-sidebar .ms-signout{justify-content:flex-start;}
body.sb-open .ms-sidebar .ms-navlist a{justify-content:flex-start;}
body.sb-open .ms-sidebar .ms-brand{justify-content:flex-start;}
body.sb-open .ms-sidebar .ms-devbadge{justify-content:flex-start;}
.ms-collapse-btn{position:fixed;top:28px;left:var(--sb-w-collapsed);transform:translateX(-50%);width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:var(--sb-navy2);color:#c3cce3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:left .18s ease;z-index:41;}
.ms-collapse-btn:hover{background:rgba(255,255,255,.12);}
.ms-collapse-btn svg{width:14px;height:14px;transition:transform .18s ease;}
body.sb-open .ms-collapse-btn{left:var(--sb-w);}
body.sb-open .ms-collapse-btn svg{transform:rotate(180deg);}
.ms-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px;}
.ms-brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1f5eff,#3ddc97);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0;}
.ms-brand-txt b{display:block;color:#fff;font-size:15px;letter-spacing:.2px;white-space:nowrap;}
.ms-brand-txt span{display:block;font-size:10px;color:#7f8bab;letter-spacing:1px;text-transform:uppercase;margin-top:2px;white-space:nowrap;}
.ms-navlabel{font-size:10px;color:#5e6b8a;text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:14px 10px 8px;white-space:nowrap;}
.ms-navlist{list-style:none;display:flex;flex-direction:column;gap:3px;margin:0;padding:0;}
.ms-navlist a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:var(--sb-text);text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s ease,color .15s ease,transform .15s ease;border:1px solid transparent;}
.ms-navlist a .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.85;}
.ms-navlist a .ic svg{width:18px;height:18px;}
.ms-navlist a:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px);}
.ms-navlist a.on{background:rgba(31,94,255,.16);color:#fff;border-color:rgba(31,94,255,.35);box-shadow:inset 3px 0 0 var(--accent);}
.ms-navlist a.on .ic{opacity:1;color:#8fb2ff;}
.ms-sidebar-spacer{flex:1;}
.ms-devbadge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--sb-gold);border-radius:10px;padding:9px 10px;margin-top:10px;}
.ms-devbadge .av{width:26px;height:26px;border-radius:999px;background:var(--sb-navy);border:1px solid var(--sb-gold);display:flex;align-items:center;justify-content:center;color:#e8d59a;font-weight:800;font-size:11px;flex-shrink:0;}
.ms-devbadge b{display:block;color:#fff;font-size:11.5px;white-space:nowrap;}
.ms-devbadge span{display:block;color:#e8d59a;font-size:10px;white-space:nowrap;}
.ms-signout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#dfe4ee;text-decoration:none;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.06);margin-top:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;}
.ms-signout:hover{background:rgba(255,255,255,.12);}
.ms-signout svg{width:16px;height:16px;flex-shrink:0;}
.ms-main{margin-left:var(--sb-w-collapsed);min-width:0;transition:margin-left .18s ease;height:100vh;}
body.sb-open .ms-main{margin-left:var(--sb-w);}
.ms-topcontent{padding:18px;height:100%;}
#hToolFrame{height:calc(100vh - 36px);border-radius:14px;overflow:hidden;border:1px solid #dfe3ec;background:#fff;}
#hToolFrame iframe{width:100%;height:100%;border:none;}
@media(max-width:900px){
  .ms-sidebar{box-shadow:4px 0 24px rgba(0,0,0,.3);}
  body.sb-open .ms-sidebar{width:var(--sb-w);}
  body.sb-open .ms-main{margin-left:var(--sb-w-collapsed);}
}
</style>
</head>
<body>
<button class="ms-collapse-btn" id="msCollapseBtn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
<aside class="ms-sidebar" id="msSidebar">
  <div class="ms-brand">
    <div class="mark">H</div>
    <div class="ms-brand-txt"><b>Hetheesha</b><span>SEO &amp; Digital Marketing</span></div>
  </div>
  <div class="ms-navlabel">Tools</div>
  <ul class="ms-navlist" id="msNavList">
    <li><a href="blog-tool/index.html" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></span><span class="lbl">Blog Tool</span></a></li>
  </ul>
  <div class="ms-sidebar-spacer"></div>
  <a class="ms-signout" href="#" id="msSignOutBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    <span class="lbl">Sign Out</span>
  </a>
  <div class="ms-devbadge">
    <div class="av">K</div>
    <div class="ms-devbadge-txt"><b>Developed by</b><span>Kuberan</span></div>
  </div>
</aside>
<div class="ms-main">
<div class="ms-topcontent">
  <div id="hToolFrame">
    <iframe src="blog-tool/index.html" title="Blog Tool"></iframe>
  </div>
</div>
</div>
<script>
document.getElementById('msCollapseBtn').addEventListener('click', function () {
  document.body.classList.toggle('sb-open');
});
document.getElementById('msSignOutBtn').addEventListener('click', function (e) {
  e.preventDefault();
  fetch('/api/auth?action=logout', { method: 'POST', credentials: 'same-origin' })
    .finally(function () { window.location.href = '../login.html'; });
});
</script>
</body>
</html>
