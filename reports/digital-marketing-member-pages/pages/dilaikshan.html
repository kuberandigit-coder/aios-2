<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilaikshan — DM Admin</title>
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmLjcY_EQCfTH_PBtRFCfzPx0fXIbAPc2wCN6HqMvV4fHLbhGQR5pW7nSBIBOHLUQG_J8_My-FM-iA9x1SndiEHp8RzNWpR0RggXJqDmel-LkilGycX_hwyji4qnxuC_PgFB1bjzw=s680-w680-h510-rw">
<style>html{visibility:hidden;opacity:0;}html.dm-ready{opacity:1;transition:opacity .16s ease;}</style>
<script>
(function () {
  fetch('/api/auth?action=session', { credentials: 'same-origin' }).then(function (r) {
    if (r.status !== 200) { window.location.replace('../login.html'); return; }
    return r.json();
  }).then(function (data) {
    if (!data) return;
      if (data && data.success && data.user && data.user.staff_key === 'dilaikshan') {
        window.__dmUser = data.user;
        document.documentElement.style.visibility = 'visible';
        requestAnimationFrame(function () { document.documentElement.classList.add('dm-ready'); });
        return;
      }
    window.location.replace('../login.html');
  }).catch(function () { window.location.replace('../login.html'); });
})();
</script>
<style>
:root{--sb-navy:#0c1a30;--sb-navy2:#0e2143;--sb-gold:#c9a227;--sb-text:#aab4c8;--sb-w:270px;--sb-w-collapsed:72px;--ink:#1a2233;--muted:#5b6577;--line:#e3e7ee;--bg:#f5f7fa;--card:#fff;--accent:#1f5eff;--accent-soft:#eaf0ff;--good:#0a7d4f;--bad:#c62828;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden;color:var(--ink);}
.app-shell{min-height:100vh;}

.t-sidebar{width:var(--sb-w-collapsed);background:var(--sb-navy);color:var(--sb-text);display:flex;flex-direction:column;padding:16px 10px;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;transition:width .18s ease,padding .18s ease;z-index:40;}
.t-sidebar .t-brand-txt,.t-sidebar .t-navlabel,.t-sidebar .t-navlist a span.lbl,.t-sidebar .t-back span.lbl{display:none;}
.t-sidebar .t-navlist a{justify-content:center;}
.t-sidebar .t-brand{justify-content:center;}
.t-sidebar .t-back{justify-content:center;}
body.sb-open .t-sidebar{width:var(--sb-w);padding:16px 14px;}
body.sb-open .t-sidebar .t-brand-txt,body.sb-open .t-sidebar .t-navlabel,body.sb-open .t-sidebar .t-navlist a span.lbl,body.sb-open .t-sidebar .t-back span.lbl{display:block;}
body.sb-open .t-sidebar .t-navlist a{justify-content:flex-start;}
body.sb-open .t-sidebar .t-brand{justify-content:flex-start;}
body.sb-open .t-sidebar .t-back{justify-content:flex-start;}

.t-collapse-btn{position:fixed;top:28px;left:var(--sb-w-collapsed);transform:translateX(-50%);width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:var(--sb-navy2);color:#c3cce3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:left .18s ease;z-index:41;}
.t-collapse-btn:hover{background:rgba(255,255,255,.12);}
.t-collapse-btn svg{transition:transform .18s ease;}
body.sb-open .t-collapse-btn{left:var(--sb-w);}
body.sb-open .t-collapse-btn svg{transform:rotate(180deg);}

.t-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px;position:relative;}
.t-brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1f5eff,#3ddc97);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0;}
.t-brand-txt b{display:block;color:#fff;font-size:15px;letter-spacing:.2px;white-space:nowrap;}
.t-brand-txt span{display:block;font-size:10px;color:#7f8bab;letter-spacing:1px;text-transform:uppercase;margin-top:2px;white-space:nowrap;}

.t-sidebar-spacer{flex:1;}
.t-back{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#dfe4ee;text-decoration:none;font-size:12.5px;font-weight:700;margin-top:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;cursor:pointer;}
.t-back:hover{color:#fff;}

.t-main{margin-left:var(--sb-w-collapsed) !important;min-width:0;display:flex;flex-direction:column;transition:margin-left .18s ease;position:relative;z-index:1;}
body.sb-open .t-main{margin-left:var(--sb-w) !important;}
.t-topbar{background:var(--sb-navy2);color:#fff;padding:12px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:3px solid var(--sb-gold);}
.t-topbar h1{font-size:16px;font-weight:800;margin-top:5px;letter-spacing:.2px;line-height:1.2;}
.t-topbar .datestr{color:#9fb0d1;font-size:11px;margin-top:2px;}
.t-topcontent{padding:18px 26px 36px;}

@media(max-width:900px){
  .t-sidebar{box-shadow:4px 0 24px rgba(0,0,0,.3);}
  body.sb-open .t-sidebar{width:var(--sb-w);}
  body.sb-open .t-main{margin-left:var(--sb-w-collapsed) !important;}
  .t-topcontent,.t-topbar{padding-left:16px;padding-right:16px;}
}

/* Sample ASIN table -- same tbox/tbar/scroll pattern the other staff pages use */
.tbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.05);margin-bottom:20px;}
.tbar{padding:12px 18px;border-bottom:1px solid var(--line);background:#f8f9fa;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.tbar b{color:var(--ink);font-size:13px;}
.tbar .sub{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:8px;}
.sample-tag{display:inline-block;border-radius:6px;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:#fef3e2;color:#7d4e00;border:1px solid #f7d9a8;}
.scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
thead th{background:#f8f9fb;text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#42506a;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{background:#eef0f7;}
thead th::after{content:' ⇅';color:#aaa;font-size:10px;}
thead th.sort-asc::after{content:' ↑';color:var(--accent);}
thead th.sort-desc::after{content:' ↓';color:var(--accent);}
thead th.num,td.num{text-align:right;}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:var(--accent-soft);}
tfoot td{padding:11px 14px;border-top:2px solid var(--line);font-weight:800;color:var(--ink);background:#f8f9fa;}
.asin{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-weight:600;color:var(--ink);letter-spacing:.3px;}
.asin-title{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:2px;}
</style>
</head>
<body>
<div class="app-shell">

<button class="t-collapse-btn" id="tCollapseBtn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
<aside class="t-sidebar" id="tSidebar">
  <div class="t-brand">
    <div class="mark">D</div>
    <div class="t-brand-txt"><b>Dilaikshan</b><span>DM Admin</span></div>
  </div>

  <div class="t-sidebar-spacer"></div>

  <a class="t-back" href="#" id="tSignOutBtn">
    <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
    <span class="lbl" id="tSignOutLbl">Log Out</span>
  </a>
</aside>

<div class="t-main">
  <div class="t-topbar">
    <div>
      <h1>Dilaikshan — Dashboard</h1>
      <div class="datestr" id="whoLbl"></div>
    </div>
  </div>
  <div class="t-topcontent">
    <div class="tbox">
      <div class="tbar">
        <div><b>Amazon — ASIN Performance</b><span class="sub">Orders and sales by ASIN</span></div>
        <span class="sample-tag">Sample data</span>
      </div>
      <div class="scroll">
        <table id="asinTable">
          <thead>
            <tr>
              <th data-key="asin">ASIN</th>
              <th data-key="orders" class="num">Orders</th>
              <th data-key="sales" class="num">Sales</th>
            </tr>
          </thead>
          <tbody id="asinBody"></tbody>
          <tfoot>
            <tr>
              <td>Total (<span id="totRows">0</span> ASINs)</td>
              <td class="num" id="totOrders">0</td>
              <td class="num" id="totSales">&pound;0.00</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// Placeholder rows only -- no endpoint serves Amazon ASIN data yet. When one
// exists, swap SAMPLE_ROWS for a fetch returning the same
// {asin,title,orders,sales} shape and renderAsinTable() keeps working as-is.
var SAMPLE_ROWS = [
  { asin: 'B08KFQ9L2M', title: 'LED Downlight 6W Warm White — 10 Pack', orders: 412, sales: 8642.50 },
  { asin: 'B07XR4T8VN', title: 'GU10 Smart Bulb RGB — 4 Pack', orders: 287, sales: 6114.30 },
  { asin: 'B09MND3W7K', title: 'LED Strip Light 5m Cool White', orders: 233, sales: 4108.75 },
  { asin: 'B06ZY8HCPQ', title: 'Outdoor PIR Floodlight 30W', orders: 168, sales: 3927.20 },
  { asin: 'B08JT6BR5D', title: 'Panel Light 600x600 40W', orders: 141, sales: 3560.00 },
  { asin: 'B07QK2VLZ9', title: 'Emergency Bulkhead Light IP65', orders: 96, sales: 1874.40 },
  { asin: 'B09HW5NDX3', title: 'Track Light Kit 3-Head Black', orders: 74, sales: 1622.85 },
  { asin: 'B08LMP7QCF', title: 'Solar Wall Lantern — 2 Pack', orders: 58, sales: 986.10 },
];

var asinSort = { key: 'sales', dir: 'desc' };

function fmtMoney(n) {
  return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderAsinTable() {
  var rows = SAMPLE_ROWS.slice().sort(function (a, b) {
    var x = a[asinSort.key], y = b[asinSort.key];
    var cmp = (typeof x === 'string') ? x.localeCompare(y) : x - y;
    return asinSort.dir === 'asc' ? cmp : -cmp;
  });

  document.getElementById('asinBody').innerHTML = rows.map(function (r) {
    return '<tr>' +
      '<td><span class="asin">' + r.asin + '</span><span class="asin-title">' + r.title + '</span></td>' +
      '<td class="num">' + r.orders.toLocaleString('en-GB') + '</td>' +
      '<td class="num">' + fmtMoney(r.sales) + '</td>' +
    '</tr>';
  }).join('');

  var totOrders = rows.reduce(function (t, r) { return t + r.orders; }, 0);
  var totSales = rows.reduce(function (t, r) { return t + r.sales; }, 0);
  document.getElementById('totRows').textContent = rows.length;
  document.getElementById('totOrders').textContent = totOrders.toLocaleString('en-GB');
  document.getElementById('totSales').textContent = fmtMoney(totSales);

  Array.prototype.forEach.call(document.querySelectorAll('#asinTable thead th'), function (th) {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.key === asinSort.key) th.classList.add(asinSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
  });
}

(function initUI() {
  var u = window.__dmUser || {};

  Array.prototype.forEach.call(document.querySelectorAll('#asinTable thead th'), function (th) {
    th.addEventListener('click', function () {
      var key = th.dataset.key;
      // Same-column click flips direction; a new column starts descending
      // (highest orders/sales first), except ASIN which reads better A-Z.
      if (asinSort.key === key) {
        asinSort.dir = asinSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        asinSort.key = key;
        asinSort.dir = key === 'asin' ? 'asc' : 'desc';
      }
      renderAsinTable();
    });
  });
  renderAsinTable();

  document.getElementById('whoLbl').textContent = 'Signed in as ' + (u.display_name || u.username || '') + ' (admin)';

  document.getElementById('tCollapseBtn').addEventListener('click', function () {
    document.body.classList.toggle('sb-open');
  });

  document.getElementById('tSignOutBtn').addEventListener('click', function (e) {
    e.preventDefault();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth?action=logout', true);
    xhr.withCredentials = true;
    xhr.onload = function () { document.documentElement.classList.remove('dm-ready'); setTimeout(function () { window.location.replace('../login.html'); }, 160); };
    xhr.send(null);
  });
})();
</script>
</body>
</html>
