<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEDSone — DM Dashboard Login</title>
<style>
:root{--navy:#0c1a30;--navy2:#0e2143;--gold:#c9a227;--ink:#1a2233;--muted:#5b6577;--line:#e6e9ef;--bg:#eef1f6;--card:#fff;--accent:#1f5eff;--accent-soft:#eaf0ff;--bad:#c62828;--bad-soft:#fdecea;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}

.card{width:100%;max-width:400px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(12,26,48,.14);border:1px solid var(--line);}
.card-top{background:linear-gradient(160deg,var(--navy),var(--navy2) 75%);padding:34px 36px 26px;border-bottom:3px solid var(--gold);}
.brand{display:flex;align-items:center;gap:12px;}
.brand .mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#1f5eff,#3ddc97);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand .mark svg{width:22px;height:22px;color:#fff;}
.brand .txt b{display:block;color:#fff;font-size:16px;letter-spacing:.2px;}
.brand .txt span{display:block;font-size:10.5px;color:#93a3c4;letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
.card-top h1{margin:22px 0 0;font-size:17px;font-weight:800;color:#fff;}
.card-top p{margin:5px 0 0;font-size:12.5px;color:#9fb0d1;}

.form-body{padding:30px 36px 34px;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.field{margin-bottom:18px;}
.input-wrap{position:relative;}
.input-wrap svg.leading{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none;}
.field input{width:100%;padding:12px 14px 12px 38px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;color:var(--ink);background:#fbfcfe;transition:border-color .15s ease, box-shadow .15s ease;outline:none;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff;}
.field input#password{padding-right:40px;}

.toggle-pass{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.toggle-pass:hover{background:var(--line);color:var(--ink);}
.toggle-pass svg{width:17px;height:17px;}
.toggle-pass .eye-off{display:none;}
.toggle-pass.shown .eye{display:none;}
.toggle-pass.shown .eye-off{display:block;}

.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:background .15s ease,transform .1s ease;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:hover{background:#1749cc;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.65;cursor:not-allowed;}
.btn svg{width:16px;height:16px;}
.spinner{width:15px;height:15px;border-radius:999px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none;}
.btn.loading .spinner{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.error{display:none;align-items:flex-start;gap:9px;margin-top:16px;padding:11px 13px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-size:12.5px;font-weight:600;border:1px solid rgba(198,40,40,.2);line-height:1.4;}
.error.show{display:flex;}
.error svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}

.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.foot svg{width:13px;height:13px;flex-shrink:0;color:var(--muted);}
</style>
</head>
<body>
  <div class="card">
    <div class="card-top">
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"></path></svg></span>
        <span class="txt"><b>LEDSone</b><span>DM Dashboard</span></span>
      </div>
      <h1>Sign in to your account</h1>
      <p>Enter your credentials to continue.</p>
    </div>
    <div class="form-body">
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password" title="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 4.22-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        <button class="btn" id="submitBtn" type="submit">
          <span class="spinner"></span>
          <span class="btn-label" id="submitBtnLabel">Log In</span>
        </button>
        <div class="error" id="errorBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span id="errorText"></span>
        </div>
      </form>
      <div class="foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Access is role-based. Contact your administrator for account issues.</span>
      </div>
    </div>
  </div>

<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const errorText = document.getElementById('errorText');
const submitBtn = document.getElementById('submitBtn');
const toggleBtn = document.getElementById('togglePass');
const passInput = document.getElementById('password');

toggleBtn.addEventListener('click', () => {
  const shown = toggleBtn.classList.toggle('shown');
  passInput.type = shown ? 'text' : 'password';
  toggleBtn.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
  toggleBtn.setAttribute('title', shown ? 'Hide password' : 'Show password');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.classList.add('loading');
  document.getElementById('submitBtnLabel').textContent = 'Logging in…';

  const username = document.getElementById('username').value.trim();
  const password = passInput.value;

  try {
    const res = await fetch('/api/auth?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'same-origin',
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Invalid username or password.');
    }
    if (!data.redirect) throw new Error('No landing page configured for this account.');
    window.location.href = data.redirect;
  } catch (err) {
    errorText.textContent = err.message || 'Something went wrong. Please try again.';
    errorBox.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
    document.getElementById('submitBtnLabel').textContent = 'Log In';
  }
});
</script>
</body>
</html>
